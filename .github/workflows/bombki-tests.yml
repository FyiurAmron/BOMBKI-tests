name: bombki-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fpc-conformance:
    name: FPC TP-mode conformance sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run conformance sweep in FPC image
        run: |
          docker run --rm \
            -e CONF_ARTIFACTS=/src/tests/artifacts \
            -v "${{ github.workspace }}":/src -w /src \
            freepascal/fpc:3.2.2-full \
            sh tests/pas-conformance.sh

      - name: Upload sweep artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: pas-sweep
          path: tests/artifacts/
          if-no-files-found: warn

  tp7-conformance:
    name: TP7 conformance sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use published TP7 image or build locally
        id: image
        run: |
          if docker pull ghcr.io/rzuf79/bombki-dosbox-tp7:latest; then
            echo "image=ghcr.io/rzuf79/bombki-dosbox-tp7:latest" >> "$GITHUB_OUTPUT"
          else
            echo "Published image unavailable; building docker/dosbox-tp7 locally"
            docker build -t bombki-tp7 docker/dosbox-tp7
            echo "image=bombki-tp7" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TP7 conformance sweep in DOSBox image
        run: |
          timeout 300s docker run --rm \
            -e CONF_ARTIFACTS=/workspace/tests/artifacts \
            -v "${{ github.workspace }}":/workspace \
            --entrypoint sh \
            ${{ steps.image.outputs.image }} \
            -c 'sh /workspace/tests/tp7-conformance.sh'

      - name: Compare reconstructed TPUs byte-for-byte
        run: |
          python3 tests/compare_tpu.py \
            --original-dir _reference \
            --rebuilt-dir tests/artifacts

      - name: Compare rebuilt EXE byte-for-byte
        run: |
          cmp tests/artifacts/BOMBKI.EXE _reference/BOMBKI.EXE
          echo "EXE byte-identical: tests/artifacts/BOMBKI.EXE"

      - name: Upload sweep artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: tp7-sweep
          path: tests/artifacts/
          if-no-files-found: warn
